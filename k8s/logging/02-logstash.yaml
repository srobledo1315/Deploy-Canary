apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: docuprocess-logging
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: log-collector
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json_lines
      }
      beats {
        port => 5044
      }
    }

    filter {
      if [message] {
        mutate {
          add_field => { "received_at" => "%{@timestamp}" }
        }
      }
      if [tenant_id] {
        mutate {
          add_tag => [ "enterprise_tenant" ]
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch-service.docuprocess-logging.svc.cluster.local:9200"]
        index => "docuprocess-logs-%{+YYYY.MM.dd}"
      }
      stdout {
        codec => rubydebug { metadata => false }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: docuprocess-logging
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: log-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/part-of: docuprocess-cloud
        app.kubernetes.io/component: log-collector
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.17.2
          ports:
            - name: tcp-json
              containerPort: 5000
              protocol: TCP
            - name: beats
              containerPort: 5044
              protocol: TCP
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
      volumes:
        - name: config-volume
          configMap:
            name: logstash-config
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  namespace: docuprocess-logging
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: log-collector
spec:
  type: ClusterIP
  ports:
    - name: tcp-json
      port: 5000
      targetPort: 5000
      protocol: TCP
    - name: beats
      port: 5044
      targetPort: 5044
      protocol: TCP
  selector:
    app.kubernetes.io/name: logstash
