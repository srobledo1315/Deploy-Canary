apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuprocess-frontend
  namespace: docuprocess-app
  labels:
    app.kubernetes.io/name: docuprocess-frontend
    app.kubernetes.io/part-of: docuprocess-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docuprocess-frontend
  template:
    metadata:
      labels:
        app: docuprocess-frontend
    spec:
      containers:
        - name: frontend
          image: docuprocess-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: docuprocess-frontend-service
  namespace: docuprocess-app
  labels:
    app.kubernetes.io/name: docuprocess-frontend
    app.kubernetes.io/part-of: docuprocess-cloud
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: docuprocess-frontend
