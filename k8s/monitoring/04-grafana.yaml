apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: docuprocess-cloud
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.docuprocess-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 5s

      - name: Elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch-service.docuprocess-logging.svc.cluster.local:9200
        database: "[docuprocess-logs-]YYYY.MM.DD"
        jsonData:
          version: "8.0.0+"
          timeField: "@timestamp"
          interval: "Daily"
        editable: false

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-service.docuprocess-monitoring.svc.cluster.local:16686
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: docuprocess-cloud
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'docuprocess-dashboards'
        orgId: 1
        folder: 'DocuProcess Cloud'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-docuprocess
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: docuprocess-cloud
data:
  docuprocess-unified.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "title": "DocuProcess Cloud - Unified Executive & Technical Observability",
      "tags": ["docuprocess", "red", "use", "saas", "canary"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "panels": [
        {
          "type": "row",
          "title": "1. Business & Executive KPIs (SaaS Metrics)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "title": "Total Processed Documents",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(docuprocess_documents_total) or vector(0)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "unit": "none" }
          }
        },
        {
          "title": "Active Enterprise Sessions",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(docuprocess_active_users) or vector(0)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } }
          }
        },
        {
          "title": "Processing Success Rate (%)",
          "type": "gauge",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "targets": [
            { "datasource": "Prometheus", "expr": "(sum(rate(docuprocess_documents_total{status=\"SUCCESS\"}[5m])) / sum(rate(docuprocess_documents_total[5m])) * 100) or vector(100)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "min": 0, "max": 100, "unit": "percent", "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 95 }, { "color": "green", "value": 99 }] } }
          }
        },
        {
          "title": "Estimated SaaS Cloud Cost ($/day)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum(rate(node_cpu_seconds_total[5m])) * 0.04 * 24 or vector(3.20)", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "currencyUSD", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } }
          }
        },
        {
          "type": "row",
          "title": "2. Application Layer (RED Model - Rate, Errors, Duration & Canary Split)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false
        },
        {
          "title": "Request Rate by Version (Canary 90/10 Split)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 6 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum by (version) (rate(http_server_requests_seconds_count[1m]))", "legendFormat": "{{version}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineInterpolation": "smooth" } } }
        },
        {
          "title": "HTTP Error Rate (4xx vs 5xx)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 6 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum by (status) (rate(http_server_requests_seconds_count{status=~\"[45]..\"}[1m]))", "legendFormat": "HTTP {{status}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "title": "Asynchronous Processing Duration (P50, P95, P99)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 6 },
          "targets": [
            { "datasource": "Prometheus", "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket{uri=~'.*process.*'}[1m])) by (le))", "legendFormat": "P50 Latency", "refId": "A" },
            { "datasource": "Prometheus", "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri=~'.*process.*'}[1m])) by (le))", "legendFormat": "P95 Latency", "refId": "B" },
            { "datasource": "Prometheus", "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{uri=~'.*process.*'}[1m])) by (le))", "legendFormat": "P99 Latency", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "type": "row",
          "title": "3. Infrastructure & Cluster Layer (USE Model - Utilization, Saturation, Errors)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 },
          "collapsed": false
        },
        {
          "title": "Node CPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 13 },
          "targets": [
            { "datasource": "Prometheus", "expr": "(1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))) * 100", "legendFormat": "CPU Busy %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "unit": "percent" } }
        },
        {
          "title": "Container Memory Working Set",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 13 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"docuprocess-.*\"})", "legendFormat": "{{namespace}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "title": "Pod Replicas (HPA Target Status)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 13 },
          "targets": [
            { "datasource": "Prometheus", "expr": "sum by (deployment) (kube_deployment_status_replicas{namespace=\"docuprocess-app\"})", "legendFormat": "{{deployment}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "none" } }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: visualization-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: docuprocess-cloud
        app.kubernetes.io/component: visualization-dashboard
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "DocuGrafanaSecure2026!"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-docuprocess
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: visualization-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
