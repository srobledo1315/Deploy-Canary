apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: telemetry-pipeline
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      batch:
        send_batch_size: 256
        timeout: 1s

    exporters:
      otlp/jaeger:
        endpoint: jaeger-service.docuprocess-monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: telemetry-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: docuprocess-cloud
        app.kubernetes.io/component: telemetry-pipeline
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.118.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: otel-collector-config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
  namespace: docuprocess-monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: telemetry-pipeline
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  selector:
    app.kubernetes.io/name: otel-collector

