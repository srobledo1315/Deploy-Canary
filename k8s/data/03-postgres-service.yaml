apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: docuprocess-data
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgresql

