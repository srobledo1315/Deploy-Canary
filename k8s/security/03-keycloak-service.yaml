apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: docuprocess-security
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: docuprocess-cloud
    app.kubernetes.io/component: identity-provider
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak

